<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#070909">
  <title>Projects | YALERIMA TECHNOLOGIES LIMITED</title>
  <meta name="description" content="Explore projects built by YALERIMA TECHNOLOGIES LIMITED.">
  <link rel="stylesheet" href="/admin-system/assets/portal.css">
</head>

<body class="portal-body public-page">

<header class="public-header">
  <a href="/" class="portal-brand">
    <span class="portal-logo">
      <img src="/logo.png" alt="Yalerima Technologies Limited">
    </span>

    <span>
      <strong>YALERIMA</strong>
      <small>TECHNOLOGIES LIMITED</small>
    </span>
  </a>

  <nav>
    <a href="/">Home</a>
    <a href="/message.html">Message Us</a>
    <a href="/admin-system/login.html">Admin</a>
  </nav>
</header>

<main class="public-main projects-public">
  <section class="public-hero">
    <div class="portal-kicker">
      SELECTED WORK
    </div>

    <h1>
      Projects built with
      <em>purpose.</em>
    </h1>

    <p>
      Explore published projects and digital systems
      created by YALERIMA TECHNOLOGIES LIMITED.
    </p>
  </section>

  <section class="project-toolbar">
    <input
      id="projectSearch"
      type="search"
      placeholder="Search projects..."
    >

    <select id="categoryFilter">
      <option value="">All categories</option>
    </select>
  </section>

  <section
    id="projectGrid"
    class="public-project-grid"
  ></section>

  <div
    id="emptyProjects"
    class="empty-public"
    hidden
  >
    No published projects match your search.
  </div>
</main>

<footer class="public-footer">
  <span>© 2026 YALERIMA TECHNOLOGIES LIMITED</span>
  <span>Designed &amp; engineered in Nigeria</span>
</footer>

<script>
  const SUPABASE_URL =
    "https://ooxknodhtlowkxolizoq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Zz1GZKarl9DiRlAoTzI6MQ_1uZ5OWEZ";

  const grid =
    document.getElementById("projectGrid");

  const empty =
    document.getElementById("emptyProjects");

  const search =
    document.getElementById("projectSearch");

  const filter =
    document.getElementById("categoryFilter");

  let projects = [];

  async function loadProjects() {
    grid.innerHTML =
      '<div class="loading-public">Loading projects...</div>';

    try {
      const url =
        SUPABASE_URL +
        "/rest/v1/projects" +
        "?select=*" +
        "&published=eq.true" +
        "&order=display_order.asc,created_at.desc";

      const response = await fetch(url, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization:
            "Bearer " + SUPABASE_KEY
        }
      });

      if (!response.ok) {
        throw new Error(
          await response.text()
        );
      }

      projects = await response.json();

      const categories = [
        ...new Set(
          projects
            .map(
              (item) =>
                item.category ||
                item.project_category
            )
            .filter(Boolean)
        )
      ];

      categories.forEach((category) => {
        const option =
          document.createElement("option");

        option.value = category;
        option.textContent = category;

        filter.appendChild(option);
      });

      render();
    } catch (error) {
      console.error(error);

      grid.innerHTML =
        '<div class="portal-alert error">Projects could not be loaded at this time.</div>';
    }
  }

  function render() {
    const query =
      search.value.trim().toLowerCase();

    const category = filter.value;

    const visible = projects.filter((project) => {
      const text = [
        project.title,
        project.project_name,
        project.short_description,
        project.description,
        project.category
      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      const matchesSearch =
        !query || text.includes(query);

      const projectCategory =
        project.category ||
        project.project_category ||
        "";

      const matchesCategory =
        !category ||
        projectCategory === category;

      return matchesSearch && matchesCategory;
    });

    grid.innerHTML = "";

    empty.hidden = visible.length !== 0;

    visible.forEach((project) => {
      const card =
        document.createElement("article");

      card.className =
        "public-project-card";

      const image =
        project.cover_image ||
        project.image_url ||
        project.project_logo ||
        "";

      card.innerHTML = `
        <div class="public-project-image">
          ${
            image
              ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(project.title || project.project_name || "Project")}">`
              : `<div class="project-placeholder"><img src="/logo.png" alt=""></div>`
          }
        </div>

        <div class="public-project-body">
          <div class="project-meta">
            <span>${escapeHtml(project.category || project.project_category || "PROJECT")}</span>
            ${
              project.featured
                ? "<b>FEATURED</b>"
                : ""
            }
          </div>

          <h2>
            ${escapeHtml(
              project.title ||
              project.project_name ||
              "Untitled project"
            )}
          </h2>

          <p>
            ${escapeHtml(
              project.short_description ||
              project.description ||
              "Digital project developed by Yalerima Technologies Limited."
            )}
          </p>

          <a
            href="/project.html?id=${encodeURIComponent(project.id)}"
          >
            View Project
            <span>↗</span>
          </a>
        </div>
      `;

      grid.appendChild(card);
    });
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  search.addEventListener("input", render);
  filter.addEventListener("change", render);

  loadProjects();
</script>

</body>
</html>
